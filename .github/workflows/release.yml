# Publish the Python reference implementation to PyPI.
#
# Runs on a pushed tag vX.Y.Z. Uses PyPI trusted publishing (OIDC), so no API
# token is stored anywhere: the PyPI project trusts this repository, this
# workflow file, and the `pypi` environment. Renaming any of them breaks
# publishing until the publisher on pypi.org is updated to match.
#
# A version can never be re-uploaded to PyPI, so the build job refuses a tag
# that does not match the version in pyproject.toml.

name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: implementations/python
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Tag matches package version
        run: |
          version=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match pyproject version ${version}" >&2
            exit 1
          fi

      - name: Unit tests
        run: |
          pip install -e ".[test]"
          pytest

      - name: Build
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: implementations/python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/mzprov
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1
