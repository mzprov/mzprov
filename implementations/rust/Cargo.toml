[package]
name = "mzprov"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Independent Rust implementation of mzprov v0 (verifier)."
license = "Apache-2.0"
repository = "https://github.com/theGreatHerrLebert/mzprov"
readme = "README.md"

[lib]
name = "mzprov"
path = "src/lib.rs"

[[bin]]
name = "mzprov"
path = "src/bin/mzprov.rs"

[dependencies]
base64 = "0.22"
blake2 = "0.10"
clap = { version = "4", features = ["derive"] }
data-encoding = "2"
ed25519-dalek = { version = "2", default-features = false, features = ["std", "pkcs8", "pem"] }
flate2 = "1"
getrandom = "0.2"
hex = "0.4"
mzdata = { version = "0.63", default-features = false, features = ["mzml"] }
pem = "3"
roxmltree = "0.20"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-normalization = "0.1"
